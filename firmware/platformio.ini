[env]
platform     = espressif32
board        = esp32-s3-devkitc-1
framework    = arduino
extra_scripts = post:merge_firmware.py

monitor_speed = 115200
upload_speed  = 921600

# diagram.json wires esp32s3 with serialInterface=USB_SERIAL_JTAG, so Serial must be
# routed to the USB-Serial-JTAG peripheral (USB_MODE=1 + CDC_ON_BOOT=1), not UART0.
lib_deps =
    waspinator/AccelStepper @ ^1.64

[env:esp32-s3-devkitc-1]
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:wokwi-test]
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DWOKWI_FORCE_HOME_SWITCHES
